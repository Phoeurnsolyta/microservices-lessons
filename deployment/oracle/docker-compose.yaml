services:
  oracle:
    image: gvenzl/oracle-free:latest
    container_name: istad-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "qwerqwer"
      APP_USER: "iteuser"
      APP_USER_PASSWORD: "userqwerqwer"
    volumes:
      - oracle-data:/opt/oracle/oradata
    networks:
      - ite-net

volumes:
  oracle-data:
    name: kafka_oracle-data
    external: true

networks:
  ite-net:
    external: true