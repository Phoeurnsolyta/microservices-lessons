services:
  istad-debezium-kafka-connect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: istad-debezium-kafka-connect
    hostname: istad-debezium-kafka-connect
    ports:
      - "8083:8083"
    environment:
      #      connect cluster
      CONNECT_BOOTSTRAP_SERVERS: "istad-kafka-1:9090,istad-kafka-2:9090,istad-kafka-3:9090"
      CONNECT_GROUP_ID: "istad-connect-cluster"
      # Kafka Connect internal topics
      CONNECT_CONFIG_STORAGE_TOPIC: "istad-connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "istad-connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "istad-connect-status"
      # Replication across your 3 brokers
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      # Avro + Schema Registry
      CONNECT_KEY_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: "http://istad-schema-registry:8081"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://istad-schema-registry:8081"
      # Internal Connect topic format
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      # REST API
      CONNECT_REST_PORT: 8083
      CONNECT_REST_ADVERTISED_HOST_NAME: "istad-debezium-kafka-connect"
      # Connector plugin locations
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
    networks:
      - ite-net
networks:
  ite-net:
    external: true