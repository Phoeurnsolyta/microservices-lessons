plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation 'kh.edu.istad:business-domain-core'
    implementation 'kh.edu.istad:business-application-service'
    implementation 'kh.edu.istad:business-service-message'
    implementation 'kh.edu.istad:business-service-persistence'
    implementation 'kh.edu.istad:business-service-restapi'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'

}