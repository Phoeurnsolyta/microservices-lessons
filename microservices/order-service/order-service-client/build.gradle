plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

// build.gradle
repositories {
    mavenCentral()
    maven {
        name = 'buf'
        url 'https://buf.build/gen/maven'
    }
}

dependencies {

    implementation('build.buf.gen:lyta_buf-contracts_grpc_java:1.85.1.1.20261106045652.63e944af8d80')
    implementation('build.buf.gen:lyta_buf-contracts_protocolbuffers_java:36.2.0.1.20261106045652.63e944af8d80')
    implementation 'kh.edu.istad:order-application-service'
    implementation 'kh.edu.istad:customer-service-contract'

    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    testImplementation 'io.projectreactor:reactor-test'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'

}