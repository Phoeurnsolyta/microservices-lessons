server:
  forward-headers-strategy: framework
  port: 6767
spring:
  grpc:
    client:
      channel:
        customer-service:
          target: static://localhost:9091
  main:
    web-application-type: reactive
  application:
    name: order-service

  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver

  profiles:
    active: dev
  config:
    import: "optional:consul:"
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}-${random.value}
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
      client:
        registration:
          service-client:
            provider: authorization-server
            authorization-grant-type: client_credentials
            client-id: order-service
            client-secret: order-secret
            client-authentication-method: client_secret_basic
            scope:
              - customer.read
        provider:
          authorization-server:
            token-uri: http://localhost:9000/oauth2/token

management:
  endpoints:
    web:
      exposure:
        include: "health, gateway"
  endpoint:
    gateway:
      access: read_only
