spring:
  application:
    name: order-service
  r2dbc:
    url: r2dbc:postgresql://localhost:9543/db_order
    username: iteuser
    password: qwerqwer

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    url: jdbc:postgresql://localhost:9543/db_order
    user: iteuser
    password: qwerqwer
    driver-class-name: org.postgresql.Driver

  profiles:
    active: dev
  config:
    import: "optional:consul:"
  cloud:
    consul:
      discovery:
        health-check-url: http://host.docker.internal:${server.port}/actuator/health
        prefer-ip-address: true
        service-name: order-service
        instance-id: ${spring.application.name}-${random.value}
      config:
        enabled: true
        format: yaml
        watch:
          enabled: true
  security:
    oauth2:
      client:
        registration:
          service-client:
            authorization-grant-type: client_credentials
            client-id:
            client-name:
            client-secret:


