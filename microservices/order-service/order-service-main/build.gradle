plugins {
    id 'spring-boot-common-conventions'
}

ext {
    set('springCloudVersion', "2025.1.4")
}

dependencies {
    implementation 'kh.edu.istad:order-domain-core'
    implementation 'kh.edu.istad:order-application-service'
    implementation 'kh.edu.istad:order-service-message'
    implementation 'kh.edu.istad:order-service-persistence'
    implementation 'kh.edu.istad:order-service-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}