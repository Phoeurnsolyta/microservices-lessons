plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation 'kh.edu.istad:iam-domain-core'
    implementation 'kh.edu.istad:iam-application-service'
    implementation 'kh.edu.istad:iam-web'
    implementation 'kh.edu.istad:iam-persistence'
    implementation 'kh.edu.istad:iam-rest-api'
    implementation 'kh.edu.istad:iam-infrastructure'
    implementation libs.springdoc.openapi.starter.webmvc.ui

    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-authorization-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    runtimeOnly 'org.postgresql:postgresql'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

