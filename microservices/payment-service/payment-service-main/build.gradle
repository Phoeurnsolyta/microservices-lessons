plugins {
    id 'spring-boot-common-conventions'
    id 'spring-cloud-common-conventions'
}

dependencies {
    implementation 'kh.edu.istad:istad-common-swagger'
    implementation 'kh.edu.istad:payment-domain-core'
    implementation 'kh.edu.istad:payment-application-service'
    implementation 'kh.edu.istad:payment-service-message'
    implementation 'kh.edu.istad:payment-service-persistence'
    implementation 'kh.edu.istad:payment-service-restapi'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-config'
    implementation 'org.springframework.cloud:spring-cloud-starter-consul-discovery'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:3.2.0'
}
